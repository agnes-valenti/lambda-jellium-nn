[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "fvmc"
description = "Variational Monte Carlo for Fermionic Systems in First Quantization"
authors = [{name = "Yixiao Chen", email = "yixiaoc@princeton.edu"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha"
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "flax",
    "ml-collections",
    # required: hamiltonian.calc_spin_lapl imports it unconditionally
    "fwdlap@git+https://github.com/y1xiaoc/fwdlap",
]

[project.urls]
Homepage = "https://github.com/y1xiaoc/fvmc"

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff]
select =[
    "E", # pycodestyle error
    "F", # pyflake
    "W", # whitespace
    "NPY", # numpy
    "TID", # tidy-imports
    "B", # bugbear
]
ignore = [
    "E731", # Do not assign a lambda expression, use a def 
    "E741", # Don't use I, O, l as variable names
    "F401", # unused import
    "E701", # allow Multiple statements on one line (colon)
    "PT023",# ignore @pytest.mark.slow
    "B011", # Do not assert False
    "TID252", # no relative imports from parents (may remove this when making a release package)
]
line-length = 100
target-version = "py39" # Minimum jax version

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402"]
